# Optional alternative; the existing Google emulator compose files are unchanged.
# docker compose -f docker-compose-localcloud.yaml up -d --wait
# export GOOGLE_CLOUD_PROJECT=brighter-test
# export SPANNER_EMULATOR_HOST=localhost:9010
# bash setup-spanner-emulator.sh
# Run the existing Spanner tests with these SDK settings.
services:
  localcloud:
    image: agentcloud/localcloud@sha256:6c619bcf17c56c08de45c60e8b5eac0b5d48317434b4abab3d3fb0c0150226b5
    environment:
      LOCALCLOUD_SERVICES: spanner
      LOCALCLOUD_PROJECT: brighter-test
      LOCALCLOUD_DOCKER_ACCESS: "false"
      LOCALCLOUD_TELEMETRY: "false"
    ports:
      - "127.0.0.1:9010:5386"
      - "127.0.0.1:9020:5387"
